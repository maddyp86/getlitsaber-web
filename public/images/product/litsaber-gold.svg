<svg width="160" height="160" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark backdrop matching reference -->
    <radialGradient id="goldBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <!-- Brushed-gold face: light catches upper-left, falls off lower-right -->
    <radialGradient id="goldFace" cx="38%" cy="32%" r="78%">
      <stop offset="0%"  stop-color="#F6E7A8"/>
      <stop offset="32%" stop-color="#E6C766"/>
      <stop offset="62%" stop-color="#C9A347"/>
      <stop offset="86%" stop-color="#A6822F"/>
      <stop offset="100%" stop-color="#8C6A22"/>
    </radialGradient>
    <!-- Bright rim highlight ring -->
    <linearGradient id="goldRim" x1="20%" y1="8%" x2="80%" y2="95%">
      <stop offset="0%"   stop-color="#FFF6D6"/>
      <stop offset="45%"  stop-color="#D8B45A"/>
      <stop offset="100%" stop-color="#6E521A"/>
    </linearGradient>
    <radialGradient id="goldGloss" cx="40%" cy="28%" r="42%">
      <stop offset="0%"  stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="160" height="160" rx="6" fill="url(#goldBg)"/>
  <!-- rim -->
  <circle cx="80" cy="80" r="62" fill="url(#goldRim)"/>
  <!-- face inset -->
  <circle cx="80" cy="80" r="58" fill="url(#goldFace)"/>
  <!-- specular gloss -->
  <ellipse cx="64" cy="56" rx="40" ry="34" fill="url(#goldGloss)"/>
</svg>
