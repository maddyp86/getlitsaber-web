<svg width="160" height="160" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="silverBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <!-- Brushed-silver face -->
    <radialGradient id="silverFace" cx="38%" cy="32%" r="78%">
      <stop offset="0%"  stop-color="#F4F5F7"/>
      <stop offset="34%" stop-color="#D2D5DA"/>
      <stop offset="64%" stop-color="#B3B7BE"/>
      <stop offset="87%" stop-color="#9A9EA6"/>
      <stop offset="100%" stop-color="#868A92"/>
    </radialGradient>
    <linearGradient id="silverRim" x1="20%" y1="8%" x2="80%" y2="95%">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="45%"  stop-color="#C2C6CC"/>
      <stop offset="100%" stop-color="#71757C"/>
    </linearGradient>
    <radialGradient id="silverGloss" cx="40%" cy="28%" r="42%">
      <stop offset="0%"  stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="160" height="160" rx="6" fill="url(#silverBg)"/>
  <circle cx="80" cy="80" r="62" fill="url(#silverRim)"/>
  <circle cx="80" cy="80" r="58" fill="url(#silverFace)"/>
  <ellipse cx="64" cy="56" rx="40" ry="34" fill="url(#silverGloss)"/>
</svg>
